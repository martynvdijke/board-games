services:
  shelf:
    build:
      context: .
      args:
        VERSION: ${VERSION:-local}
    image: the-shelf:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6290:6290"
    volumes:
      - shelf-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6290/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

volumes:
  shelf-data:
